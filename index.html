<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d5bd0"><link rel="manifest" href="manifest.json"><title>English Adventure</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#26304b;background:#f5f3ff}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 15px;background:#6d5bd0;color:white;font-weight:700;min-height:44px}button.secondary{background:#ece9ff;color:#403494}button:disabled{opacity:.45}header{background:linear-gradient(115deg,#6d5bd0,#b66ac8);color:white;padding:18px 16px}main{max-width:850px;margin:auto;padding:15px}.panel{background:white;border:1px solid #e7e4f2;border-radius:20px;padding:18px;margin:13px 0;box-shadow:0 4px 15px #3224660a}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.level{padding:15px 8px;background:#f0edff;color:#403494;border-radius:14px;text-align:center}.level.active{background:#6d5bd0;color:white}.muted{color:#65718a;font-size:.92rem}.ltr{direction:ltr;text-align:left}.center{text-align:center}.big{font-size:clamp(2rem,8vw,4rem);font-weight:800}.picture{font-size:clamp(4rem,14vw,7rem);text-align:center;line-height:1.4}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choices button{background:#f0edff;color:#30345a;border:2px solid transparent;direction:ltr}.choices button.selected{border-color:#6d5bd0;background:#dfd9ff}.chip{display:inline-block;background:#edeaff;border-radius:30px;padding:7px 11px;margin:3px}.pill{background:#fff8df;color:#735400;padding:5px 11px;border-radius:30px}.feedback{padding:13px;border-radius:12px;background:#eff9f0;margin-top:12px}.error{background:#fff0f0}.answer{width:100%;border:2px solid #d9d4f1;border-radius:12px;padding:13px;margin:9px 0;direction:ltr;text-align:left}.story{font-size:1.2rem;line-height:1.85;direction:ltr;text-align:left;background:#f8f7ff;padding:15px;border-radius:12px}.mini{font-size:.85rem}h1,h2,h3,p{margin:8px 0 12px}.hidden{display:none!important}.money{background:linear-gradient(120deg,#c7e9d2,#9dc8e5);border:2px solid #70a58d;color:#234b42;border-radius:12px;text-align:center;padding:16px;font-size:1.8rem;font-weight:800;direction:ltr}.divider{border:0;border-top:1px solid #e9e7f2;margin:15px 0}.wordtiles{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:center}.wordtiles button{background:#e9e5ff;color:#433a88}input[type=number]{width:90px}footer{text-align:center;color:#777;padding:30px 10px}#app{min-height:70vh}@media(max-width:420px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:13px}.choices{grid-template-columns:1fr 1fr}header h1{font-size:1.5rem}} </style></head><body><header><div class="row"><div><h1>🌍 English Adventure</h1><div>לומדים אנגלית דרך משחק, תמונות ושמע</div></div><div id="headUser"></div></div></header><main id="app"></main><footer>ההתקדמות נשמרת במכשיר זה בלבד · English Adventure v1</footer><script>
'use strict';
const KEY='english_adventure_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){db={}};db.players??=[];db.pending??=[];db.settings??={email:'',pin:''};let current=null,level=1,mode='learn',index=0,answered=false,chosen=[],activeQuestions=[],placement=null;
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const words=[
{w:'apple',pic:'🍎',he:'תפוח',level:1},{w:'cat',pic:'🐈',he:'חתול',level:1},{w:'dog',pic:'🐕',he:'כלב',level:1},{w:'sun',pic:'☀️',he:'שמש',level:1},{w:'ball',pic:'⚽',he:'כדור',level:1},{w:'book',pic:'📘',he:'ספר',level:1},{w:'fish',pic:'🐟',he:'דג',level:2},{w:'milk',pic:'🥛',he:'חלב',level:2},{w:'tree',pic:'🌳',he:'עץ',level:2},{w:'house',pic:'🏠',he:'בית',level:2},{w:'chair',pic:'🪑',he:'כיסא',level:2},{w:'bird',pic:'🐦',he:'ציפור',level:2},{w:'flower',pic:'🌻',he:'פרח',level:3},{w:'window',pic:'🪟',he:'חלון',level:3},{w:'school',pic:'🏫',he:'בית ספר',level:3},{w:'water',pic:'💧',he:'מים',level:3},{w:'bicycle',pic:'🚲',he:'אופניים',level:3},{w:'breakfast',pic:'🥣',he:'ארוחת בוקר',level:4},{w:'library',pic:'📚',he:'ספרייה',level:4},{w:'garden',pic:'🌷',he:'גינה',level:4},{w:'umbrella',pic:'☂️',he:'מטרייה',level:5},{w:'adventure',pic:'🧭',he:'הרפתקה',level:6}];
const sentences=[{s:'The cat is sleeping.',pic:'🐈💤',level:3,question:'What is the cat doing?',opts:['Sleeping','Running','Eating','Swimming'],answer:'Sleeping'},{s:'The dog is playing with a ball.',pic:'🐕⚽',level:4,question:'What is the dog playing with?',opts:['A ball','A book','A hat','A chair'],answer:'A ball'},{s:'Maya drinks water after school.',pic:'👧💧🏫',level:4,question:'What does Maya drink?',opts:['Water','Milk','Juice','Tea'],answer:'Water'},{s:'On Saturday, Tom visits the library to find a book about space.',pic:'👦📚🚀',level:5,question:'Why does Tom visit the library?',opts:['To find a book','To buy a bike','To meet a dog','To eat lunch'],answer:'To find a book'},{s:'Lily wanted to play outside, but it started raining. She decided to read a book at home instead.',pic:'👧🌧️📖',level:6,question:'Why did Lily stay home?',opts:['It started raining','She was tired','She lost her shoes','She had a test'],answer:'It started raining'}];
function speak(s,slow=false){if(!('speechSynthesis'in window)){alert('המכשיר אינו תומך בהקראה');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=slow?.72:.9;speechSynthesis.speak(u)}
function player(){return db.players.find(p=>p.id===current)}function setHeader(){$('headUser').innerHTML=player()?`<button class="secondary" onclick="home()">${esc(player().name)} · ⭐ ${player().stars}</button>`:''}function render(html){$('app').innerHTML=html;setHeader()}function home(){current=null;render(`<section class="panel"><h2>מי משחקת היום?</h2><div class="grid">${db.players.map(p=>`<button class="secondary" onclick="openPlayer('${p.id}')">🧒 ${esc(p.name)}<br><small>⭐ ${p.stars} · רמה ${p.level}</small></button>`).join('')}</div><hr class="divider"><h3>הוספת שחקנית</h3><div class="row"><input id="newName" maxlength="25" placeholder="שם הילדה" class="answer" style="max-width:240px;direction:rtl"><button onclick="addPlayer()">הוספה</button></div><p class="muted">לכל ילדה התקדמות, כוכבים וחנות משלה.</p></section><div class="panel"><button class="secondary" onclick="parentLogin()">🔒 אזור הורים</button></div>`)}function addPlayer(){let n=$('newName').value.trim();if(!n)return alert('יש להזין שם');if(db.players.length>=6)return alert('אפשר להוסיף עד שש שחקניות');let p={id:'p'+Date.now(),name:n,stars:0,level:1,done:{},earnedToday:{}};db.players.push(p);save();openPlayer(p.id)}function openPlayer(id){current=id;dashboard()}
function dashboard(){let p=player();render(`<div class="panel"><div class="row"><h2>שלום, ${esc(p.name)}! 👋</h2><span class="pill">⭐ ${p.stars} כוכבים</span></div><p>בחרי עולם או התחילי במבחן התאמה.</p><div class="row"><button onclick="startPlacement()">🎯 מבחן התאמה</button><button class="secondary" onclick="shop()">💵 חנות הכוכבים</button><button class="secondary" onclick="home()">החלפת שחקנית</button></div></div><section class="panel"><h3>ששת העולמות</h3><div class="levels">${['ABC World','First Words','Word Explorer','Sentence Builder','Story Adventure','English Master'].map((n,i)=>`<button class="level ${p.level===i+1?'active':''}" onclick="chooseLevel(${i+1})"><strong>${i+1}. ${n}</strong><br><small>${i+1<=p.level?'פתוח':'אפשר לנסות'}</small></button>`).join('')}</div></section><section class="panel"><h3>איך לומדים?</h3><p>🔊 שומעים · 🖼️ רואים · 📖 קוראים · ✍️ כותבים</p><p class="muted">במצב לימוד אפשר לקבל רמזים. במצב מבחן אין רמזים. בכל רמה יש משימות מגוונות.</p></section>`)}function chooseLevel(n){level=n;render(`<section class="panel"><h2>עולם ${n}: ${['ABC World','First Words','Word Explorer','Sentence Builder','Story Adventure','English Master'][n-1]}</h2><p>בחרי כיצד לתרגל:</p><div class="grid"><button onclick="startGame('learn')">📚 מצב לימוד</button><button class="secondary" onclick="startGame('test')">📝 מצב מבחן</button></div><p class="muted">עשר שאלות בכל סבב. ניתן לחזור על הרמה כמה פעמים.</p><button class="secondary" onclick="dashboard()">חזרה לעולמות</button></section>`)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function questionBank(n){let pool=words.filter(w=>w.level<=Math.max(2,n));let qs=[];pool.forEach((w,i)=>{let distract=shuffle(pool.filter(x=>x.w!==w.w)).slice(0,3).map(x=>x.w);qs.push({type:'pick',pic:w.pic,prompt:'Which word matches the picture?',options:shuffle([w.w,...distract]),answer:w.w,say:w.w,hint:w.he});if(n<=3)qs.push({type:'spell',pic:w.pic,prompt:'Write the word in English',answer:w.w,say:w.w,hint:w.w[0]+'…'});if(n<=2){let first=w.w[0].toUpperCase();qs.push({type:'pick',pic:w.pic,prompt:'Which letter does this word start with?',options:shuffle([first,...shuffle('BCDFGHLMNPRST'.split('').filter(c=>c!==first)).slice(0,3)]),answer:first,say:w.w,hint:w.w})}if(n>=2)qs.push({type:'listen',pic:'🔊',prompt:'Listen and choose the word',options:shuffle([w.w,...distract]),answer:w.w,say:w.w,hint:w.he})});if(n>=3){sentences.filter(s=>s.level<=n).forEach(s=>{qs.push({type:'pick',pic:s.pic,prompt:s.s+'\n'+s.question,options:shuffle(s.opts),answer:s.answer,say:s.s,hint:'קראי שוב את המשפט'});qs.push({type:'order',pic:s.pic,prompt:'Build the sentence',answer:s.s.replace(/\.$/,''),say:s.s,hint:s.s.split(' ').slice(0,2).join(' ')+' …'})})}if(n>=4)sentences.filter(s=>s.level<=n).forEach(s=>qs.push({type:'write',pic:s.pic,prompt:'Write a sentence about the picture',answer:s.s,say:s.s,hint:'התחילי באות גדולה וסיימי בנקודה'}));return qs}
function startGame(m){placement=null;mode=m;index=0;answered=false;activeQuestions=shuffle(questionBank(level)).slice(0,10);showQuestion()}function showQuestion(){let q=activeQuestions[index];if(!q)return finish();answered=false;chosen=[];let visual=q.pic?`<div class="picture">${q.pic}</div>`:'';let input='';if(q.type==='pick'||q.type==='listen')input=`<div class="choices">${q.options.map((o,i)=>`<button onclick="selectAnswer(${i})">${esc(o)}</button>`).join('')}</div>`;if(q.type==='spell'||q.type==='write')input=`<input class="answer" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><button onclick="checkTyped()">בדיקה</button>`;if(q.type==='order')input=`<div id="built" class="story center" style="min-height:55px"></div><div class="wordtiles" id="tiles">${shuffle(q.answer.split(' ')).map((w,i)=>`<button data-word="${esc(w)}" onclick="pickTile(this)">${esc(w)}</button>`).join('')}</div><div class="row" style="margin-top:10px"><button onclick="checkOrder()">בדיקה</button><button class="secondary" onclick="showQuestion()">ניקוי</button></div>`;render(`<div class="panel"><div class="row"><span class="pill">עולם ${level} · ${mode==='test'?'מבחן':'לימוד'}</span><span>${index+1} / ${activeQuestions.length}</span></div><progress value="${index+1}" max="${activeQuestions.length}" style="width:100%;margin-top:12px"></progress>${visual}<h2 class="ltr" style="white-space:pre-line">${esc(q.prompt)}</h2><div class="row"><button class="secondary" onclick="speak(activeQuestions[index].say)">🔊 Listen</button><button class="secondary" onclick="speak(activeQuestions[index].say,true)">🐢 Slow</button>${mode==='learn'?`<button class="secondary" onclick="showHint()">💡 רמז</button>`:''}</div><div id="hint" class="muted"></div><div style="margin-top:15px">${input}</div><div id="result"></div><div id="next"></div></div>`)}function showHint(){$('hint').textContent='רמז: '+activeQuestions[index].hint}function normalize(s){return String(s).toLowerCase().replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim()}function selectAnswer(i){if(answered)return;let q=activeQuestions[index];let a=q.options[i];[...document.querySelectorAll('.choices button')].forEach((b,j)=>b.classList.toggle('selected',i===j));check(a)}function checkTyped(){if(answered)return;let a=$('typed').value.trim();if(!a)return;check(a)}function pickTile(b){if(answered)return;chosen.push(b.dataset.word);b.disabled=true;$('built').textContent=chosen.join(' ')}function checkOrder(){if(!chosen.length)return;check(chosen.join(' '))}function check(a){if(answered)return;let q=activeQuestions[index],ok=normalize(a)===normalize(q.answer);answered=true;let p=player();let earned=0;if(placement){placement.push(ok?1:0)}else if(ok){let key=level+':'+q.type+':'+q.answer;let today=new Date().toISOString().slice(0,10);p.earnedToday[today]??=0;if(!p.done[key]&&p.earnedToday[today]<30){earned=2;p.stars+=earned;p.earnedToday[today]+=earned;p.done[key]=true}}save();$('result').innerHTML=`<div class="feedback ${ok?'':'error'}">${ok?'✅ Great job!':'💡 כדאי לנסות שוב בסבב הבא.'}<br><span class="ltr">Answer: ${esc(q.answer)}</span>${earned?`<br>⭐ +${earned} כוכבים`:''}</div>`;$('next').innerHTML=`<button style="margin-top:12px;width:100%" onclick="nextQuestion()">${index===activeQuestions.length-1?'סיום הסבב':'השאלה הבאה ←'}</button>`;setHeader()}function nextQuestion(){index++;showQuestion()}function finish(){let p=player();if(placement){let score=placement.reduce((a,b)=>a+b,0);let suggested=score>=10?5:score>=8?4:score>=6?3:score>=4?2:1;p.level=Math.max(p.level,suggested);save();placement=null;render(`<div class="panel center"><h2>מבחן ההתאמה הסתיים</h2><p>הצלחת ב־${score} מתוך 12 שאלות.</p><p>רמת התחלה מומלצת: ${suggested}</p><p class="muted">זו הערכה ראשונית בלבד. אפשר לבחור כל עולם באופן חופשי.</p><button onclick="dashboard()">מעבר לעולמות</button></div>`);return}p.level=Math.max(p.level,level);save();render(`<div class="panel center"><div class="big">🎉</div><h2>כל הכבוד, ${esc(p.name)}!</h2><p>סיימת סבב בעולם ${level}.</p><p class="pill">⭐ ${p.stars} כוכבים</p><div class="row" style="justify-content:center"><button onclick="startGame(mode)">עוד סבב</button><button class="secondary" onclick="dashboard()">חזרה לעולמות</button></div></div>`)}
function startPlacement(){placement=null;level=2;mode='test';activeQuestions=shuffle(questionBank(2)).slice(0,4).concat(shuffle(questionBank(4)).slice(0,4),shuffle(questionBank(6)).slice(0,4));index=0;showQuestion();}
const rewards=[{sum:5,cost:100},{sum:10,cost:180},{sum:20,cost:320},{sum:50,cost:700}];function shop(){let p=player();render(`<div class="panel"><div class="row"><h2>💵 Star Bank</h2><span class="pill">⭐ ${p.stars}</span></div><p>בחרי פרס. הבקשה תועבר לאישור הורה; אין תשלום אוטומטי.</p><div class="grid">${rewards.map((r,i)=>`<div class="panel"><div class="money">${r.sum} ₪</div><p class="center">⭐ ${r.cost}</p><button style="width:100%" ${p.stars<r.cost?'disabled':''} onclick="requestReward(${i})">בקשת פרס</button></div>`).join('')}</div><h3>הבקשות שלי</h3>${db.pending.filter(x=>x.pid===p.id).map(x=>`<p>₪${x.sum} — ${x.status==='pending'?'ממתין לאישור':x.status==='approved'?'אושר':'נדחה'}</p>`).join('')||'<p class="muted">אין בקשות עדיין.</p>'}<button class="secondary" onclick="dashboard()">חזרה</button></div>`)}function requestReward(i){let r=rewards[i],p=player();if(p.stars<r.cost)return;if(!confirm(`לבקש פרס של ${r.sum} ₪ תמורת ${r.cost} כוכבים?`))return;p.stars-=r.cost;db.pending.push({id:'r'+Date.now(),pid:p.id,sum:r.sum,cost:r.cost,status:'pending',created:new Date().toISOString()});save();let subj=encodeURIComponent('English Adventure - בקשת פרס חדשה');let body=encodeURIComponent(`${p.name} ביקשה פרס של ${r.sum} ש״ח תמורת ${r.cost} כוכבים.\nיש להיכנס לאזור ההורים באותו מכשיר ולאשר או לדחות.\nהודעה זו נפתחה באופן ידני ולא נשלחה אוטומטית.`);let mail=db.settings.email?`mailto:${encodeURIComponent(db.settings.email)}?subject=${subj}&body=${body}`:`mailto:?subject=${subj}&body=${body}`;shop();if(confirm('הבקשה נשמרה. לפתוח הודעת דוא״ל מוכנה לשליחה?'))location.href=mail}
function parentLogin(){if(!db.settings.pin){let pin=prompt('הגדירו קוד הורה בן 4–8 ספרות');if(!pin||!/^[0-9]{4,8}$/.test(pin))return alert('יש להזין 4–8 ספרות');db.settings.pin=pin;save()}let pin=prompt('קוד הורה');if(pin!==db.settings.pin)return alert('קוד שגוי');parentPanel()}function parentPanel(){render(`<div class="panel"><h2>🔒 אזור הורים</h2><p class="muted">הגנה בסיסית בלבד: נתונים וקוד שמורים בדפדפן ואינם מאובטחים מפני משתמש טכני.</p><label>דוא״ל להתראות (פתיחת הודעה מוכנה, לא שליחה אוטומטית)</label><input class="answer" id="parentEmail" type="email" value="${esc(db.settings.email)}" placeholder="parent@example.com"><button onclick="db.settings.email=$('parentEmail').value.trim();save();alert('נשמר')">שמירת כתובת</button><h3>בקשות ממתינות</h3>${db.pending.filter(r=>r.status==='pending').map(r=>`<div class="panel"><strong>${esc(db.players.find(p=>p.id===r.pid)?.name||'שחקנית')}</strong> — ${r.sum} ₪ (${r.cost} כוכבים)<div class="row"><button onclick="resolveReward('${r.id}',true)">אישור</button><button class="secondary" onclick="resolveReward('${r.id}',false)">דחייה והחזרת כוכבים</button></div></div>`).join('')||'<p>אין בקשות ממתינות.</p>'}<hr class="divider"><button class="secondary" onclick="home()">סגירה</button></div>`)}function resolveReward(id,yes){let r=db.pending.find(x=>x.id===id);if(!r||r.status!=='pending')return;r.status=yes?'approved':'rejected';if(!yes){let p=db.players.find(p=>p.id===r.pid);if(p)p.stars+=r.cost}save();parentPanel()}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));home();
</script></body></html>
